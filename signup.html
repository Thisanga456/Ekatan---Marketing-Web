<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started | EkataYan</title>

    <link rel="shortcut icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="signup.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="signup-page">

    <header class="signup-navbar">
        <a href="index.html" class="logo">
            <img src="logo.png" alt="EkataYan logo">
            Ekata<span>Yan</span>
        </a>

        <p>Already have an account?
            <a href="login.html">Log in</a>
        </p>
    </header>

    <main class="signup-main">
        <section class="signup-card">

            <div class="signup-heading">
                <div class="signup-badge">✦ Start your journey</div>
                <h1>Let's get you <span>started.</span></h1>
                <p>Create your EkataYan account and start planning smarter trips together.</p>
            </div>

            <form class="signup-form">

                <div class="form-row">
                    <div class="form-group">
                        <label for="first-name">First name</label>
                        <input type="text" id="first-name" name="first-name"
                               placeholder="Your first name" autocomplete="given-name" required>
                    </div>

                    <div class="form-group">
                        <label for="last-name">Last name</label>
                        <input type="text" id="last-name" name="last-name"
                               placeholder="Your last name" autocomplete="family-name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email"
                           placeholder="you@example.com" autocomplete="email" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password"
                               placeholder="Create a password" autocomplete="new-password" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm password</label>
                        <input type="password" id="confirm-password" name="confirm-password"
                               placeholder="Repeat password" autocomplete="new-password" required>
                    </div>
                </div>

                <label class="terms">
                    <input type="checkbox" required>
                    <span>I agree to the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a>.</span>
                </label>

                <button type="submit" class="signup-btn">Create Account <span>→</span></button>

            </form>

            <p class="mobile-login">
                Already have an account? <a href="login.html">Log in</a>
            </p>

        </section>
    </main>

</body>
</html>
