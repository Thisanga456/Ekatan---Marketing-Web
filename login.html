<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EkataYan</title>

    <link rel="shortcut icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="login-page">

    <header class="login-navbar">
        <a href="index.html" class="logo">
            <img src="logo.png" alt="EkataYan logo">
            Ekata<span>Yan</span>
        </a>

        <p>Don't have an account?
            <a href="signup.html">Get Started</a>
        </p>
    </header>

    <main class="login-main">
        <section class="login-card">

            <div class="login-heading">
                <div class="login-badge">✦ Welcome back</div>
                <h1>Welcome <span>back.</span></h1>
                <p>Log in to continue planning smarter trips with EkataYan.</p>
            </div>

            <form class="login-form">

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="you@example.com"
                           autocomplete="email"
                           required>
                </div>

                <div class="form-group">
                    <div class="password-label">
                        <label for="password">Password</label>
                        <a href="#">Forgot password?</a>
                    </div>

                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Enter your password"
                           autocomplete="current-password"
                           required>
                </div>

                <label class="remember">
                    <input type="checkbox" name="remember">
                    <span>Remember me</span>
                </label>

                <button type="submit" class="login-submit">
                    Log In <span>→</span>
                </button>

            </form>

            <div class="login-divider">
                <span>or</span>
            </div>

            <button type="button" class="google-btn">
                <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M21.35 12.27c0-.79-.07-1.55-.22-2.27H12v4.3h5.23a4.47 4.47 0 0 1-1.94 2.93v2.43h3.14c1.84-1.69 2.92-4.18 2.92-7.39z"/>
                    <path fill="#34A853" d="M12 21.7c2.63 0 4.84-.87 6.45-2.36l-3.14-2.43c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.29v2.51A9.75 9.75 0 0 0 12 21.7z"/>
                    <path fill="#FBBC05" d="M6.54 13.8a5.86 5.86 0 0 1 0-3.6V7.69H3.29a9.73 9.73 0 0 0 0 8.62l3.25-2.51z"/>
                    <path fill="#EA4335" d="M12 6.17c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.83 3.25 14.63 2.3 12 2.3a9.75 9.75 0 0 0-8.71 5.39l3.25 2.51C7.31 7.89 9.46 6.17 12 6.17z"/>
                </svg>
            Continue with Google
            </button>

            <p class="signup-prompt">
                Don't have an account?
                <a href="signup.html">Create one</a>
            </p>

        </section>
    </main>

</body>
</html>
